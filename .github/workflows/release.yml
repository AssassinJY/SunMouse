name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "SUNMOUSE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          SUNMOUSE_SIGNING_IDENTITY: '-'
          SUNMOUSE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -version
          ./Scripts/build-sunmouse
          lipo -verify_arch arm64 x86_64 build/Release/SunMouse.app/Contents/MacOS/SunMouse

      - name: Create DMG
        run: ./Scripts/package-dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "build/Release/SunMouse-v${SUNMOUSE_VERSION}.dmg" \
            --verify-tag --title "SunMouse $RELEASE_TAG" \
            --notes "适用于 macOS 26 及以上，支持 Apple Silicon 和 Intel。将 SunMouse 拖入 Applications 后打开，并授权辅助功能。首次打开的相关说明见 README。"
